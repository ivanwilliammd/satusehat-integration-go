name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          go-version-file: v4/go.mod

      - name: Test
        working-directory: v4
        run: go test ./...

      - name: Build
        working-directory: v4
        run: go build ./...

      - name: Ping Go Proxy
        working-directory: v4
        run: |
          MODULE=$(go list -m)
          GOPROXY=proxy.golang.org,direct go list -m ${MODULE}@${GITHUB_REF#refs/tags/}
          curl -s "https://proxy.golang.org/${MODULE}/@v/list"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
