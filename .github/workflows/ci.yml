name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          go-version-file: v4/go.mod
      - working-directory: v4
        run: go test ./...
      - working-directory: v4
        run: go build ./...
