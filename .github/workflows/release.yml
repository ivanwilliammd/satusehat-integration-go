name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Ping Go Proxy
        run: |
          MODULE=$(go list -m)
          GOPROXY=proxy.golang.org,direct go list -m ${MODULE}@v4.11.0

      # proxy.golang.org auto-publishes on tag push.
      # This step creates the GitHub Release.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
